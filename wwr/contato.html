<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Entre em contato com a Hagassy Rafting para dúvidas, reservas e informações sobre nossas aventuras de rafting.">

    <meta name="author" content="Yan Hagassy">

    <title>Fale Conosco | Hagassy Rafting</title>

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>

        <img src="imagens/z-splash.png" alt="Logo da Hagassy Rafting">

        <nav>
            <ul>
                <li>
                    <a href="index.html">Página Inicial</a>
                </li>

                <li>
                    <a href="sobre.html">Sobre Nós</a>
                </li>

                <li>
                    <a href="passeios.html">Passeios</a>
                </li>

                <li>
                    <a href="contato.html">Fale Conosco</a>
                </li>
            </ul>
        </nav>

    </header>


    <main>

        <section class="informacoes">

            <h1>Hagassy Rafting</h1>

            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p>info@hagassyrafting.com</p>

        </section>


        <section class="contato">

            <div class="map">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d115219.05750178728!2d-54.546701!3d-25.518532!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f690ebae530a43%3A0x21979473b4c4a952!2sFoz%20do%20Igua%C3%A7u%2C%20PR!5e0!3m2!1spt-BR!2sbr!4v1791009736993!5m2!1spt-BR!2sbr"
                    loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>


            <form>

                <div class="campo">

                    <label for="nome-completo">
                        Nome
                    </label>

                    <input type="text" id="nome-completo" name="nome-completo"
                      placeholder="Digite aqui" required>


                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite aqui" required>

                </div>


                <div class="campo-radio">

                    <span>Propósito da Mensagem</span>

                    <div class="opcoes">

                        <label for="duvida-geral">
                            <input type="radio" id="duvida-geral" name="proposito"
                              value="duvida-geral" checked>

                            Dúvida Geral
                        </label>


                        <label for="pergunta-reserva">
                            <input type="radio" id="pergunta-reserva" name="proposito"
                              value="pergunta-reserva">

                            Pergunta sobre Reserva
                        </label>


                        <label for="sugestao">
                            <input type="radio" id="sugestao" name="proposito" value="sugestao">

                            Sugestão
                        </label>

                    </div>

                </div>


                <div class="mensagem">

                    <label for="mensagem">
                        Mensagem
                    </label>

                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem aqui"
                      required></textarea>

                </div>


                <div class="newsletter">

                    <input type="checkbox" id="newsletter" name="newsletter">

                    <label for="newsletter">
                        Por favor, me inscreva na newsletter mensal
                    </label>

                </div>


                <button type="submit">
                    Entrar em Contato
                </button>

            </form>

        </section>


        <section class="funcionarios">

            <h2>Estamos Aqui para Servi-lo</h2>

            <div class="equipe">

                <figure>

                    <img src="imagens/perfil.jpg" alt="Funcionário da Hagassy Rafting">

                    <figcaption>
                        Perfil do Funcionário
                    </figcaption>

                </figure>


                <figure>

                    <img src="imagens/perfil.jpg" alt="Funcionário da Hagassy Rafting">

                    <figcaption>
                        Perfil do Funcionário
                    </figcaption>

                </figure>


                <figure>

                    <img src="imagens/perfil.jpg" alt="Funcionário da Hagassy Rafting">

                    <figcaption>
                        Perfil do Funcionário
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Hagassy Rafting | Yan Hagassy
        </p>

        <nav class="redes-sociais">

            <a href="https://www.facebook.com/">
                <img src="imagens/facebook.svg" alt="Facebook da Hagassy Rafting">
            </a>

            <a href="https://www.instagram.com/">
                <img src="imagens/instagram.svg" alt="Instagram da Hagassy Rafting">
            </a>

            <a href="https://www.tiktok.com/pt-BR/">
                <img src="imagens/tictok-bw.svg" alt="TikTok da Hagassy Rafting">
            </a>

        </nav>

    </footer>

</body>

</html>
